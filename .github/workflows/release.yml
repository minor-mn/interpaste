# GitHub の Releases でタグを選んで Release を公開すると、そのタグが指すコミットから interpaste.app を作って zip にし、その Release に添付する。
# タグを push しただけでは何もしない。
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      # Secrets の SIGNING_CERT_P12(.p12 を base64 にしたもの)を一時キーチェーンに読み込む。
      - name: Import Dr.Nitrovic certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -base64 24)
          printf %s "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          rm "$RUNNER_TEMP/signing.p12"

      # scripts/build-app.sh でビルドし、一時キーチェーンの証明書で署名する。バージョンはタグ名(先頭の v は除く)。
      - name: Build and sign app
        env:
          KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}" ./scripts/build-app.sh
          codesign -dvv build/interpaste.app

      # 失敗したときも一時キーチェーンを消す。
      - name: Delete signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # releases/latest/download/interpaste.zip で取れるよう、名前にバージョンを入れない。
      - name: Zip app
        run: ditto -c -k --keepParent build/interpaste.app interpaste.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" interpaste.zip --clobber
